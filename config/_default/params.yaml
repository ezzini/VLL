# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/
# plugins_js:
#   - media/custom

# Appearance

hugoblox:
  schema: "2.0"
  identity:
    name: VLL
    type: organization
    tagline: Vision and Language Lab
    description: ""
    organization: KFUPM
  theme:
    mode: light
    pack: minimal
    colors:
      primary: "#BD641C"
      secondary: ""
      neutral: gray
    colors_light:
      primary: ""
      secondary: ""
      neutral: ""
    colors_dark:
      primary: ""
  typography:
    font: sans
    size: md
  layout:
    radius: md
    spacing: comfortable
    avatar_shape: circle
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
  footer:
    style: minimal
    language_switcher: true
  copyright:
    notice: © {year} {name}
  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
  search:
    enable: true
