<footer class="site-footer">
    <div class="container">
        <p class="powered-by">
            {{ with site.Params.footer.copyright.notice }}{{ replace . "{year}" now.Year | markdownify}}{{ end }}
        </p>
    </div>
</footer>

<script>
    (function () {
        // Aggressively force light mode
        const enforceLightMode = () => {
            if (document.body.classList.contains('dark')) {
                document.body.classList.remove('dark');
                document.body.classList.add('light');
                localStorage.setItem('wcTheme', 'light');
            }
        };

        // Run immediately
        enforceLightMode();

        // Watch for any attempts to change it back to dark
        const observer = new MutationObserver(() => {
            enforceLightMode();
        });

        observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
    })();
</script>
